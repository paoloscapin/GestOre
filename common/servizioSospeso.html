<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servizio Temporaneamente Sospeso</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
        }
        .icon {
            font-size: 64px;
            color: #f39c12;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .footer {
            font-size: 14px;
            color: #bdc3c7;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Icona di avviso (orologio/manutenzione) -->
        <div class="icon">⏳</div>
        
        <h1>Servizio Temporaneamente Sospeso</h1>
        
        <p>Stiamo effettuando degli interventi di manutenzione per migliorare la tua esperienza. Il servizio tornerà attivo al più presto. Ci scusiamo per il temporaneo disagio.</p>
        
        <div class="footer">
            Grazie per la pazienza.
        </div>
    </div>

</body>
</html>
