<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Import ISIREL pagoPA</title>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:760px;min-width:760px;height:760px;margin:0;background:#eef7f7;color:#123;overflow:hidden}
.app{padding:14px;height:760px;display:flex;flex-direction:column}
.hero{background:linear-gradient(135deg,#0f766e,#0ea5a3 55%,#38bdf8);color:#fff;border-radius:14px;padding:16px;box-shadow:0 10px 24px rgba(15,118,110,.22)}
.hero-title{font-size:18px;font-weight:800;margin:0 0 4px;letter-spacing:0}
.hero-subtitle{font-size:12px;line-height:1.35;margin:0;color:rgba(255,255,255,.86)}
.status-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:700}
.hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.status-running .status-dot{background:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.18)}
.status-ok .status-dot{background:#22c55e}
.status-error .status-dot{background:#ef4444}
.panel{background:#fff;border:1px solid #cfe4e9;border-radius:12px;margin-top:12px;padding:12px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:800;color:#0f4f5f;margin-bottom:5px}
input{width:100%;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:9px 10px;font-size:13px;outline:none}
input:focus{border-color:#0ea5a3;box-shadow:0 0 0 3px rgba(14,165,163,.14)}
.field{margin-top:10px}
.endpoint{font-size:11px}
.btn-main{width:100%;border:0;border-radius:11px;background:#0f766e;color:#fff;margin-top:12px;padding:11px 12px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(15,118,110,.22)}
.btn-main:hover{background:#0b625b}
.btn-main:disabled{background:#94a3b8;cursor:wait;box-shadow:none}
.btn-stop{border:0;border-radius:999px;background:#dc2626;color:#fff;margin-top:12px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(220,38,38,.22)}
.btn-stop:hover{background:#b91c1c}
.btn-stop:disabled{background:#94a3b8;cursor:wait;box-shadow:none}
.btn-close-popup{border:1px solid rgba(255,255,255,.7);border-radius:999px;background:rgba(255,255,255,.18);color:#fff;margin-top:12px;padding:6px 10px;font-size:12px;font-weight:800;cursor:pointer}
.btn-close-popup:hover{background:rgba(255,255,255,.28)}
.btn-close-popup-bottom{width:100%;border:0;border-radius:11px;background:#334155;color:#fff;margin-top:10px;padding:10px 12px;font-size:13px;font-weight:800;cursor:pointer}
.btn-close-popup-bottom:hover{background:#1f2937}
.hidden{display:none!important}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px}
.summary-label{display:block;color:#64748b;font-size:11px;font-weight:700}
.summary-value{display:block;margin-top:4px;font-size:18px;font-weight:800;color:#0f172a}
.log-title{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#0f4f5f;margin-bottom:7px}
.log-panel{flex:1;min-height:0;display:flex;flex-direction:column}
pre{white-space:pre;background:#0f172a;color:#dbeafe;border-radius:10px;padding:10px;flex:1;min-height:0;overflow:auto;font-size:12px;line-height:1.45;margin:0}
.muted{color:#64748b;font-size:11px}
</style>
</head>
<body>
<div class="app">
    <section class="hero">
        <h1 class="hero-title">Import pagoPA ISIREL</h1>
        <p class="hero-subtitle">Legge gli avvisi dal portale ISIREL aperto in questa scheda e li importa in GestOre.</p>
        <div class="hero-actions">
            <div id="statusPill" class="status-pill status-idle"><span class="status-dot"></span><span id="statusText">Pronto</span></div>
            <button type="button" id="stopTopBtn" class="btn-stop hidden">Interrompi</button>
            <button type="button" id="closeTopBtn" class="btn-close-popup hidden">Chiudi estensione</button>
        </div>
    </section>

    <section class="panel log-panel">
        <div class="grid">
            <div>
                <label for="startDate">Data inizio</label>
                <input id="startDate" type="date">
            </div>
            <div>
                <label for="endDate">Data fine</label>
                <input id="endDate" type="date">
            </div>
        </div>

        <div class="field">
            <label for="schoolYear">Anno scolastico</label>
            <input id="schoolYear" type="text" placeholder="2025/2026">
        </div>

        <div class="field">
            <label for="gestoreEndpoint">Endpoint GestOre</label>
            <input id="gestoreEndpoint" class="endpoint" type="text" value="https://www.buonarroti.tn.it/GestOre/api/isirel/importaPagopa.php">
        </div>

        <button id="importBtn" class="btn-main">Importa in GestOre</button>
        <div class="muted" style="margin-top:8px">Prima apri ISIREL in una scheda dove hai gia effettuato il login.</div>
    </section>

    <section class="panel">
        <div class="summary">
            <div class="summary-card">
                <span class="summary-label">Attivita</span>
                <span class="summary-value" id="activitiesCount">-</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">Studenti</span>
                <span class="summary-value" id="studentsCount">-</span>
            </div>
        </div>
    </section>

    <section class="panel">
        <div class="log-title"><span>Log importazione</span><span id="logTime" class="muted"></span></div>
        <pre id="log"></pre>
        <button type="button" id="stopBottomBtn" class="btn-stop hidden">Interrompi importazione</button>
        <button type="button" id="closeBottomBtn" class="btn-close-popup-bottom hidden">Chiudi estensione</button>
    </section>
</div>
<script src="popup.js"></script>
</body>
</html>
